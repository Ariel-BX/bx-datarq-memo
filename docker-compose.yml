services:
  elasticmq: # simula colas sqs de aws
    image: softwaremill/elasticmq
    ports:
      - '9324:9324'
      - '9325:9325'
  pubsub-emulator: # emulador de pubsub
    image: google/cloud-sdk
    command: gcloud beta emulators pubsub start --host-port 0.0.0.0:8085
    ports:
      - '8085:8085'
